<section class="home">
    
  <div class="user-container">
  <div class="user-card">
    <div class="avatar-section">

      <h2>Datos del usuario</h2>
      <div class="avatar-wrapper" (click)="toggleAvatarSelector()">
        <img
          [src]="avatar || '/avatar/1.png'"
          alt="Avatar"
          class="avatar"
        />
        <div class="edit-icon">
          <i class="bi bi-pencil-fill"></i>
        </div>
      </div>

      <p class="avatar-help">Pulsa el avatar para cambiarlo</p>

      <div class="avatar-selector" *ngIf="showAvatarSelector">
        <img
          *ngFor="let av of avatars"
          [src]="av"
          class="avatar-option"
          (click)="selectAvatar(av)"
          alt="Avatar disponible"
        />
      </div>
    </div>

    <form [formGroup]="userForm" class="user-form">
      

      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          id="name"
          type="text"
          class="form-control"
          formControlName="name"
          placeholder="Escribe tu nombre"
        />
        <small class="error" *ngIf="nameControl?.invalid && nameControl?.touched">
          Introduce un nombre válido.
        </small>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Escribe tu correo"
        />
        <small class="error" *ngIf="emailControl?.invalid && emailControl?.touched">
          Introduce un correo electrónico válido.
        </small>
      </div>

      <button type="button" class="btn-save" (click)="saveChanges()">
        Guardar cambios
      </button>
    </form>

    <div class="password-section">
      <button type="button" class="btn-password" (click)="togglePasswordForm()">
        {{ showPasswordForm ? 'Cancelar cambio de contraseña' : 'Cambiar contraseña' }}
      </button>

      <form
        *ngIf="showPasswordForm"
        [formGroup]="passwordForm"
        class="password-form"
      >
        <div class="form-group">
          <label for="newPassword">Nueva contraseña</label>
          <input
            id="newPassword"
            type="password"
            class="form-control"
            formControlName="newPassword"
            placeholder="Nueva contraseña"
          />
          <small class="error" *ngIf="newPasswordControl?.invalid && newPasswordControl?.touched">
            La contraseña debe tener al menos 6 caracteres.
          </small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            class="form-control"
            formControlName="confirmPassword"
            placeholder="Repite la contraseña"
          />
          <small
            class="error"
            *ngIf="passwordForm.errors?.['passwordMismatch'] && confirmPasswordControl?.touched"
          >
            Las contraseñas no coinciden.
          </small>
        </div>

        <button type="button" class="btn-save" (click)="changePassword()">
          Guardar nueva contraseña
        </button>
      </form>
    </div>

    <div class="message success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="message error-box" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    <!-- ELIMINAR USUARIO -->
<div class="delete-section">
  <button class="btn-delete" (click)="deleteUser()">
    Eliminar cuenta
  </button>
</div>
  </div>
</div>
</section>
